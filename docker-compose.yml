services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-native-audio-latest}
      - GEMINI_VOICE=${GEMINI_VOICE:-Aoede}
      - ENABLE_TRANSCRIPTION=${ENABLE_TRANSCRIPTION:-true}
      - ENABLE_AFFECTIVE_DIALOG=${ENABLE_AFFECTIVE_DIALOG:-true}
      - VAD_MODE=${VAD_MODE:-hybrid}
      - VAD_START_SENSITIVITY=${VAD_START_SENSITIVITY:-high}
      - VAD_END_SENSITIVITY=${VAD_END_SENSITIVITY:-low}
      - VAD_SILENCE_DURATION_MS=${VAD_SILENCE_DURATION_MS:-700}
      - VAD_PREFIX_PADDING_MS=${VAD_PREFIX_PADDING_MS:-200}
      - GEMINI_LANGUAGE_CODE=${GEMINI_LANGUAGE_CODE:-vi-VN}
      - ENABLE_PROACTIVE_AUDIO=${ENABLE_PROACTIVE_AUDIO:-true}
      - ENABLE_GREETING=${ENABLE_GREETING:-true}
      - ENABLE_SESSION_RESUMPTION=${ENABLE_SESSION_RESUMPTION:-true}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID:-}
      - GOOGLE_CSE_KEY=${GOOGLE_CSE_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - ENV=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
    driver: local
