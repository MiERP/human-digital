name: CI/CD Pipeline - Doraemon Digital Human

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Gate 1: Kiểm thử Backend Python, Quét Bảo Mật Tĩnh & Safety Guardrails
  # =========================================================================
  backend-test-and-security:
    name: 🐍 Backend Tests & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit

      - name: Syntax & Lint Check (Flake8)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend/ -ll -ii

      - name: Run Automated Safety & Memory Unit Tests (21 Tests)
        run: |
          python -m unittest discover backend/tests

  # =========================================================================
  # Gate 2: Biên dịch Android App, Code Quality & Build APK
  # =========================================================================
  android-build:
    name: 📱 Android Build & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraemon-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
